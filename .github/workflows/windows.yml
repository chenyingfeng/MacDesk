name: Windows build and fixtures
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build portable x64 package and run fixtures
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: MacDesk-windows-x64
          path: |
            artifacts/MacDesk-windows-x64.zip
            artifacts/MacDesk-windows-x64.zip.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: macdesk-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MacDesk-windows-x64
          path: release
      - name: Publish initial preview or tag release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $expected = ((Get-Content -LiteralPath release/MacDesk-windows-x64.zip.sha256 -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath release/MacDesk-windows-x64.zip -Algorithm SHA256).Hash
          if ($expected -notmatch '^[0-9a-fA-F]{64}$' -or $actual -ne $expected) { throw 'Release package checksum mismatch.' }
          if ($env:RELEASE_REF -eq 'refs/heads/main') {
            $tag = 'v0.1.0-preview.1'
            $response = gh api --include "repos/$env:GH_REPO/git/ref/tags/$tag" 2>&1 | Out-String
            $tagResult = $LASTEXITCODE
            if ($tagResult -eq 0) {
              Write-Output 'Initial preview tag already exists; it will not be changed.'
              exit 0
            }
            if ($response -notmatch 'HTTP(?:/\S+)?\s+404\b|\(HTTP 404\)') { throw 'Unable to verify the initial preview tag; publication was stopped.' }
            gh release create $tag release/MacDesk-windows-x64.zip release/MacDesk-windows-x64.zip.sha256 --target "$env:RELEASE_COMMIT" --prerelease --title "MacDesk $tag" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Initial preview publication failed.' }
          } else {
            gh release view "$env:RELEASE_TAG" *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Output 'Release already exists; assets will not be overwritten.'
              exit 0
            }
            gh release create "$env:RELEASE_TAG" release/MacDesk-windows-x64.zip release/MacDesk-windows-x64.zip.sha256 --verify-tag --title "MacDesk $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Tag release publication failed.' }
          }
